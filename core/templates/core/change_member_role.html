{% extends "core/base.html" %}

{% block title %}Change Member Role · RepoTeam{% endblock %}

{% block content %}

<section class="form-page">

    <div class="form-header">

        <a
            href="{% url 'team_detail' team.id %}"
            class="back-link"
        >
            ← Back to team
        </a>

        <h1>Change member role</h1>

        <p>
            Update the role of
            <strong>{{ member.user.username }}</strong>
            in <strong>{{ team.name }}</strong>.
        </p>

    </div>

    <form method="post" class="app-form">

        {% csrf_token %}

        <div class="form-field">
            <label for="role">Role</label>

            <select name="role" id="role" required>
                <option
                    value="M"
                    {% if member.role == "M" %}selected{% endif %}
                >
                    Member
                </option>

                <option
                    value="A"
                    {% if member.role == "A" %}selected{% endif %}
                >
                    Admin
                </option>
            </select>
        </div>

        <div class="form-actions">

            <a
                href="{% url 'team_detail' team.id %}"
                class="button button-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="button button-primary"
            >
                Save role
            </button>

        </div>

    </form>

</section>

{% endblock %}
