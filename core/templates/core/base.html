<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}RepoTeam{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: #f7f8fa;
            color: #1f2328;
        }

        nav {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #4b5563;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #111827;
        }

        main {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .messages {
            margin-bottom: 24px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            nav {
                padding: 0 16px;
            }

            .nav-links {
                gap: 12px;
            }

            main {
                padding: 24px 16px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <nav>
        <a href="{% url 'index' %}" class="brand">RepoTeam</a>

        <div class="nav-links">
            {% if user.is_authenticated %}
                <span>{{ user.username }}</span>
<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Logout</button>
</form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <main>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}
        {% endblock %}

    </main>

</body>
</html>
